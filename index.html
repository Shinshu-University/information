<DOCTYPE! html>
  <html>
    <head>
      <title>情報委員会</title>
    </head>
    <body>
      <style id="style">
        html{background-image: url("https://shinshu-university.github.io/information/1.png");}
      </style>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique&display=swap');
        html {
          background-size: 100% auto;
          background-repeat: no-repeat;
          font-family: "Zen Kaku Gothic Antique", sans-serif;
          font-weight: 700;
          height: 1000%;
          width: 100%;
          box-sizing: border-box;
        }
        body {
          height: 100%;
          width: 100%;
        }
        .clock {
          positon: absolute;
          text-align: right;
          font-size: 11vw;
          margin-top: -4vh;
          margin-right: 2vw;
        }
        #left, #left10 {
          width: 100%;
          height: 200px;
          text-align: center;
          z-index: 999;
          background-color: rgba(92,92,92,0.8);
          color: white;
          font-size: 11vw;
          margin: auto;
          padding: 0;
        }
        .fadeout {
          animation : fadeOut 5s;
          animation-fill-mode: both;
        }
        @keyframes fadeOut {
          0% {
            opacity: 1;
          }
          100% {
            opacity: 0;
          }
        }
      </style>
      <body>
        <div class="clock"><p id="clock"></p></div>
        <div class="" id="left" style="display:none">あと30秒です</div>
        <div class="" id="left10" style="display:none">あと10秒です</div>
        <script>
            //left30();
        function audio(num) {
          const audiopass = new Audio('https://shinshu-university.github.io/information/sound'+num+'.mp3');
          audiopass.play();
        }
        function left30() {
          document.getElementById('left').style.display = '';
          audio(2);
          setTimeout( function() {
            document.getElementById('left').classList.add('fadeout');
            setTimeout( function() { 
                document.getElementById('left').style.display = 'none';
                document.getElementById('left').classList.remove('fadeout');
            }, 10000);
          }, 3000);
        }
        function left10() {
          document.getElementById('left10').style.display = '';
          audio(2);
          setTimeout( async function() {
            var count = 0;
            await setInterval ( function() { audio(3); count++; if(count == 5){clearInterval();}} ,1000);
            document.getElementById('left10').classList.add('fadeout');
            setTimeout( function() { 
                document.getElementById('left10').style.display = 'none';
                document.getElementById('left10').classList.remove('fadeout');
            }, 10000);
          }, 4000);
        }
        function dofuntion(callback) {
           callback();
        }
        function updateClock() {
          const now = new Date();
          const hours = now.getHours().toString().padStart(2, "0"); //ゼロパディングしつつ
          const mins = now.getMinutes().toString().padStart(2, "0");
          const secs = now.getSeconds().toString().padStart(2, "0");
          document.getElementById('clock').textContent = hours+":"+mins+":"+secs;
          if (hours+":"+mins+":"+secs == '12:18:00') {
            document.getElementById('style').textContent = 'html{background-image: url("https://shinshu-university.github.io/information/2.png");}';
            audio(1);
          } else if (hours+":"+mins+":"+secs == '12:20:00') {
            document.getElementById('style').textContent = 'html{background-image: url("https://shinshu-university.github.io/information/3.png");}';
            audio(1);
          } else if (hours+":"+mins+":"+secs == '12:17:30') {
            left30();
          } else if (hours+":"+mins+":"+secs == '12:19:30') {
            left30();
          } else if (hours+":"+mins+":"+secs == '12:17:50') {
            left10();
          } else if (hours+":"+mins+":"+secs == '12:19:50') {
            left10();
          }
          setTimeout(updateClock, 1000);
        }
        updateClock();
  </script>
      </body>
  </html>
